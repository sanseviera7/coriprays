<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solace in Prayer</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--bg, #000); color: var(--ink, #f2f2f2); font: 18px/1.5 -apple-system, system-ui, sans-serif; }
    main { max-width: 38rem; margin: 0 auto; padding: 12vh 1.5rem 6rem; }
    h1 { font-weight: 500; font-size: 1.6rem; }
    p { color: var(--ink); opacity: 0.78; }
    a { color: inherit; }
    nav { display: flex; flex-direction: column; gap: 0.75rem; margin: 2.5rem 0; }
    nav a { display: block; text-decoration: none; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); padding: 0.9rem 1rem; }
    nav a span { display: block; color: var(--ink); opacity: 0.55; font-size: 0.9rem; margin-top: 0.2rem; }
    .button { display: block; text-align: center; text-decoration: none; background: var(--ink); color: var(--bg); padding: 0.9rem 1rem; margin: 2rem 0; }
    .back { color: var(--ink); opacity: 0.6; font-size: 0.9rem; }
    #stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8vh 8vw; box-sizing: border-box; gap: 2.5rem; font-size: 22px; }
    #line { margin: 0; max-width: 24em; min-height: 1.5em; }
    #motif { width: 110px; height: auto; fill: none; stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #bar { position: fixed; top: 1rem; left: 1rem; right: 1rem; display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
    #bar a, #setlabel, #themes button { color: var(--ink); opacity: 0.65; background: transparent; border: 0; font: 13px -apple-system, system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    #themes { display: flex; gap: 0.4rem; }
    #themes i { display: block; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 40%, transparent); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const FEEDING = "https://give.feedingamerica.org/8u355rD-u02ytwE0jUq9jQ2?source=Y26YP6D1Z&utm_medium=cpc&utm_source=paid&utm_term=gift&utm_content=bing&utm_campaign=thanksgiving&gclid=49b8ac7ea3a91f16ecc9c6b927de9e79&gclsrc=3p.ds&msclkid=49b8ac7ea3a91f16ecc9c6b927de9e79";
    const params = new URLSearchParams(location.search);
    const page = params.get("page") || "home";
    const app = document.getElementById("app");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let paused = false;
    let pauseWaiters = [];

    const themes = [
      ["#000000","#f2f2f2"],
      ["#141a24","#e7eef8"],
      ["#1c1714","#f3ebe3"],
      ["#10211c","#e7f3ee"],
      ["#ffffff","#1a1a1a"],
      ["#f7f5f2","#2a241f"],
      ["#eef3f0","#1a2e28"]
    ];
    function loadTheme() {
      try {
        const saved = JSON.parse(localStorage.getItem("theme") || "null");
        if (Array.isArray(saved) && saved.length === 2) return saved;
      } catch (e) {}
      return themes[0];
    }
    function applyTheme(theme) {
      document.documentElement.style.setProperty("--bg", theme[0]);
      document.documentElement.style.setProperty("--ink", theme[1]);
      localStorage.setItem("theme", JSON.stringify(theme));
    }
    applyTheme(loadTheme());

    function themeDots() {
      return `<div id="themes">${themes.map((t, i) => `<button type="button" data-i="${i}" aria-label="Theme ${i + 1}"><i style="background:${t[0]}"></i></button>`).join("")}</div>`;
    }
    function bindDots() {
      document.querySelectorAll("#themes button").forEach((button) => {
        button.addEventListener("click", (event) => { event.stopPropagation(); applyTheme(themes[button.dataset.i]); });
      });
    }
    function bindPause(stage) {
      stage.addEventListener("click", (event) => {
        if (event.target.closest("a, button")) return;
        paused = !paused;
        if (!paused) pauseWaiters.splice(0).forEach((resume) => resume());
      });
    }
    function waitWhilePaused() {
      if (!paused) return Promise.resolve();
      return new Promise((resolve) => pauseWaiters.push(resolve));
    }

    const elijahLines = [
      "But he himself went a day’s journey into the wilderness and came and sat down under a broom tree. And he asked that he might die, saying, “It is enough; now, O Lord, take away my life, for I am no better than my fathers.” 1 Kings 19:4",
      "And he lay down and slept under a broom tree. And behold, an angel touched him and said to him, “Arise and eat.” And he looked, and behold, there was at his head a cake baked on hot stones and a jar of water. And he ate and drank and lay down again. And the angel of the Lord came again a second time and touched him and said, “Arise and eat, for the journey is too great for you.” 1 Kings 19:5–7",
      "And he arose and ate and drank, and went in the strength of that food forty days and forty nights to Horeb, the mount of God. 1 Kings 19:8"
    ];
    const quoteLines = [
      "Be still, and know that I am God. Psalm 46:10",
      "Come to me, all who labor and are heavy laden, and I will give you rest. Matthew 11:28",
      "Peace I leave with you; my peace I give to you. Not as the world gives do I give to you. John 14:27",
      "The Lord is my shepherd; I shall not want. Psalm 23:1",
      "I can do all things through him who strengthens me. Philippians 4:13"
    ];

    const sleep = async (ms) => {
      let left = ms;
      while (left > 0) {
        await waitWhilePaused();
        const chunk = Math.min(50, left);
        await new Promise((r) => setTimeout(r, chunk));
        left -= chunk;
      }
      await waitWhilePaused();
    };
    function delaysBetween(min, max) {
      const values = [];
      for (let v = min; v <= max; v += 5) values.push(v);
      return values;
    }
    async function typeLine(el, text, delays, hold) {
      await waitWhilePaused();
      if (reduceMotion) el.textContent = text;
      else {
        el.textContent = "";
        for (const ch of text) { await waitWhilePaused(); el.textContent += ch; await sleep(delays[Math.floor(Math.random() * delays.length)]); }
      }
      await sleep(hold);
    }

    const motifSVG = `<svg id="motif" viewBox="0 0 120 170" aria-hidden="true">
      <path d="M60 12 L60 88 M32 48 L88 48" />
      <g transform="translate(60,118)">
        <path d="M0 28 Q-26 8 -18 -8 Q0 6 18 -8 Q26 8 0 28" />
        <path d="M-14 18 Q-22 4 -12 -4 Q-4 6 -14 18" />
        <path d="M14 18 Q22 4 12 -4 Q4 6 14 18" />
        <path d="M-6 22 Q-8 12 0 8 Q8 12 6 22" />
        <circle cx="0" cy="6" r="3.5" />
      </g>
    </svg>`;

    if (page === "home") {
      app.innerHTML = `<main>
        <h1>Solace in Prayer</h1>
        <p>A quiet screen. One line at a time.</p>
        <nav>
          <a href="?page=elijah">Elijah & the Broom Tree<span>1 Kings 19:4, 5–7, and 8.</span></a>
          <a href="?page=quotes">Quotes<span>A few verses.</span></a>
        </nav>
        <a class="button" href="${FEEDING}" target="_blank">Donate to Feeding America</a>
      </main>`;
    }

    if (page === "elijah" || page === "quotes") {
      const isElijah = page === "elijah";
      const lines = isElijah ? elijahLines : quoteLines;
      const label = isElijah ? "Elijah" : "Quotes";
      app.innerHTML = `<div id="bar"><a href="?">Back</a><span id="setlabel">${label}</span>${themeDots()}</div><div id="stage"><p id="line"></p>${motifSVG}</div>`;
      bindDots();
      bindPause(document.getElementById("stage"));
      const line = document.getElementById("line");
      const delays = delaysBetween(45, 70);
      (async function run() {
        while (true) for (let i = 0; i < lines.length; i++) await typeLine(line, lines[i], delays, i === lines.length - 1 ? 2800 : 1400);
      })();
    }
  </script>
</body>
</html>
